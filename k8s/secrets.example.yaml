# Template for the Secret every Deployment in this directory reads
# DATABASE_URL from. Copy this file to secrets.yaml (already gitignored),
# fill in real connection strings for your target Postgres instance(s),
# and apply it BEFORE applying any Deployment:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   # edit k8s/secrets.yaml with real values
#   kubectl apply -f k8s/secrets.yaml
#
# Never commit the filled-in secrets.yaml — it is listed in .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: aios-db-credentials
  namespace: aios
type: Opaque
stringData:
  postgres_password: "CHANGE_ME"
  backend_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/backend"
  ai_core_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/ai_core"
  prompt_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/prompt_platform"
  agent_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/agent_platform"
  memory_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/memory_platform"
  workflow_engine_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/workflow_engine"
  tool_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/tool_platform"
  evaluation_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/evaluation_platform"
  identity_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/identity_platform"
  collaboration_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/collaboration_platform"
  observability_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/observability_platform"
  security_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/security_platform"
  infrastructure_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/infrastructure_platform"
  developer_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/developer_platform"
  api_gateway_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/api_gateway_platform"
  analytics_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/analytics_platform"
  quality_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/quality_platform"
  docs_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/docs_platform"
  release_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/release_platform"
  perf_platform_database_url: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres:5432/perf_platform"
---
# Application secrets. internal_token: sent by the console edge, required by every service.
# jwt_secret: the identity service's signing key, also used by the console to verify sessions.
# Generate each with: python -c "import secrets; print(secrets.token_urlsafe(48))"
apiVersion: v1
kind: Secret
metadata:
  name: aios-app-secrets
  namespace: aios
type: Opaque
stringData:
  internal_token: "CHANGE_ME_AT_LEAST_32_CHARACTERS"
  jwt_secret: "CHANGE_ME_AT_LEAST_32_CHARACTERS"
