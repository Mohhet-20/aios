      AIOS_WORKFLOW_URL: http://workflow-engine:8000
      AIOS_TOOL_URL: http://tool-platform:8000
      AIOS_EVALUATION_URL: http://evaluation-platform:8000
      AIOS_IDENTITY_URL: http://identity-platform:8000
