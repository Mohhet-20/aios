      AIOS_INTERNAL_TOKEN: ${AIOS_INTERNAL_TOKEN:?set AIOS_INTERNAL_TOKEN in .env}
      AIOS_JWT_SECRET: ${AIOS_JWT_SECRET:?set AIOS_JWT_SECRET in .env}
