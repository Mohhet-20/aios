# AIOS local/staging multi-service composition.
#
# This wires every platform to its own logical Postgres database on a
# single shared Postgres instance (one server, many databases — simplest
# topology for local dev and small staging environments; a real production
# rollout would typically give each platform its own managed database
# instance instead, which this file does not attempt to model).
#
# Build context note: the 6 platforms that depend on `aios-ai-core` as an
# editable sibling package (prompt/agent/memory/workflow-engine/tool/
# evaluation — see each platform's requirements.txt) must be built with the
# monorepo root as context, which is exactly what running
# `docker compose build` from this file's directory (the monorepo root)
# does automatically — do not `cd` into an individual platform directory
# and run `docker build .` for those six.
#
# Usage:
#   docker compose up --build postgres backend ai-core   # start a subset
#   docker compose up --build                            # start everything
#
# Every service exposes /health, /health/live, /health/ready on its
# container port 8000, mapped below to a unique host port per service.

# Secrets come from an untracked .env next to this file (copy .env.example). Compose refuses to start
# without them: services run with APP_ENV=production, which makes each one fail closed on a missing or
# weak AIOS_INTERNAL_TOKEN, and the identity service on a missing or weak signing key.
x-service-env: &service-env
  APP_ENV: production
  AIOS_INTERNAL_TOKEN: ${AIOS_INTERNAL_TOKEN:?set AIOS_INTERNAL_TOKEN in .env (see .env.example)}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios_dev_password
      POSTGRES_DB: aios
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: aios-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://aios:aios_dev_password@postgres:5432/backend
    ports:
      - "8000:8000"

  ai-core:
    build:
      context: aios-ai-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://aios:aios_dev_password@postgres:5432/ai_core
    ports:
      - "8001:8000"

  prompt-platform:
    build:
      context: .
      dockerfile: aios-prompt-platform/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://aios:aios_dev_password@postgres:5432/prompt_platform
    ports:
      - "8002:8000"

  agent-platform:
