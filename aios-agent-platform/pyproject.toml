[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in default arguments is the idiomatic,
# required pattern for dependency injection — not a real bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before app modules are imported

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
