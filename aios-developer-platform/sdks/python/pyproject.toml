[project]
name = "aios-dev-sdk"
version = "1.0.0"
description = "Official Python SDK for the AIOS Enterprise Developer Platform."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.2", "pytest-asyncio>=0.23.7"]

[tool.setuptools.packages.find]
include = ["aios_dev_sdk*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
